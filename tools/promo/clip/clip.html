<!doctype html>
<html>
<meta charset="utf-8">
<title>clip</title>
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// The "film" the promo's player shows: a sunrise over ridges and a lake, with a small boat. Drawn for a time t.
const W = 1920, H = 1080, c = document.getElementById('c'), g = c.getContext('2d');
window.DURATION = 12;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = rng(20261120);
const lerp = (a, b, t) => a + (b - a) * t;
const hex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const x = hex(a), y = hex(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], t))).join(',')})`; };
const BAR = 0, LAKE = 800;
const ridges = Array.from({ length: 6 }, (_, i) => ({
  base: 520 + i * 52, amp: 120 - i * 12, speed: 6 + i * i * 4.5, col: mix('#F2A28F', '#231C3F', Math.pow(i / 5, 0.8)),
  f: [0.0016 + R() * 0.001, 0.0041 + R() * 0.002, 0.011 + R() * 0.004, 0.027 + R() * 0.01], ph: [R() * 6, R() * 6, R() * 6, R() * 6], rough: 0.6 + i * 0.25,
}));
const ridgeY = (r, x) => r.base - r.amp * (0.55 * Math.sin(x * r.f[0] + r.ph[0]) + 0.3 * Math.sin(x * r.f[1] + r.ph[1]) + 0.1 * r.rough * Math.sin(x * r.f[2] + r.ph[2]) + 0.04 * r.rough * Math.sin(x * r.f[3] + r.ph[3]));
const glints = Array.from({ length: 260 }, () => ({ x: R(), y: Math.pow(R(), 1.6), w: 0.3 + R(), ph: R() * 6.28, sp: 1 + R() * 2.5 }));
const grain = document.createElement('canvas'); grain.width = 480; grain.height = 270;
{ const gg = grain.getContext('2d'), d = gg.createImageData(480, 270); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (R() - 0.5) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 9; } gg.putImageData(d, 0, 0); }

function draw(t) {
  const sunX = 1180, sunY = 600 - t * 9, sunR = 92;
  let s = g.createLinearGradient(0, 0, 0, LAKE);
  s.addColorStop(0, '#22305C'); s.addColorStop(0.42, '#8E5A8E'); s.addColorStop(0.68, '#F0907A'); s.addColorStop(1, '#FFD49A');
  g.fillStyle = s; g.fillRect(0, 0, W, LAKE);
  // sun and its glow
  let gl = g.createRadialGradient(sunX, sunY, 0, sunX, sunY, 620);
  gl.addColorStop(0, 'rgba(255,236,190,.85)'); gl.addColorStop(0.18, 'rgba(255,200,140,.42)'); gl.addColorStop(1, 'rgba(255,170,120,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, LAKE);
  g.fillStyle = '#FFF4D8'; g.beginPath(); g.arc(sunX, sunY, sunR, 0, 7); g.fill();
  // ridges with mist between them
  ridges.forEach((r, i) => {
    const off = t * r.speed;
    g.fillStyle = r.col; g.beginPath(); g.moveTo(0, LAKE);
    for (let x = 0; x <= W; x += 8) g.lineTo(x, ridgeY(r, x + off));
    g.lineTo(W, LAKE); g.closePath(); g.fill();
    const m = g.createLinearGradient(0, r.base - 20, 0, r.base + 150);
    m.addColorStop(0, 'rgba(255,196,160,0)'); m.addColorStop(1, `rgba(255,196,160,${0.34 - i * 0.045})`);
    g.fillStyle = m; g.fillRect(0, r.base - 20, W, 170);
  });
  // birds
  g.strokeStyle = 'rgba(40,28,60,.85)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 9; i++) {
    const bx = 420 + t * 46 + (i - 4) * 44, by = 300 + Math.abs(i - 4) * 26 + Math.sin(t * 0.8 + i) * 6, flap = Math.sin(t * 7 + i * 0.9) * 9, k = 1 - Math.abs(i - 4) * 0.04;
    g.beginPath(); g.moveTo(bx - 16 * k, by + flap * 0.4); g.quadraticCurveTo(bx - 8 * k, by - 8 - flap, bx, by); g.quadraticCurveTo(bx + 8 * k, by - 8 - flap, bx + 16 * k, by + flap * 0.4); g.stroke();
  }
  // lake
  let l = g.createLinearGradient(0, LAKE, 0, H);
  l.addColorStop(0, '#C9788A'); l.addColorStop(0.3, '#6B4A82'); l.addColorStop(1, '#231C3F');
  g.fillStyle = l; g.fillRect(0, LAKE, W, H - LAKE);
  g.globalCompositeOperation = 'lighter';
  for (const p of glints) {
    const y = LAKE + 4 + p.y * (H - LAKE - BAR - 8), depth = (y - LAKE) / (H - LAKE), spread = 60 + depth * 520;
    const x = sunX + (p.x - 0.5) * 2 * spread + Math.sin(t * 0.7 + p.ph) * 14, a = Math.max(0, Math.sin(t * p.sp + p.ph)) * (0.2 + 0.6 * (1 - Math.abs(p.x - 0.5) * 2));
    g.fillStyle = `rgba(255,214,160,${a.toFixed(3)})`;
    const w = (14 + depth * 70) * p.w, h = 2 + depth * 4;
    g.beginPath(); g.roundRect(x - w / 2, y, w, h, h / 2); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  // the boat
  const bx = 560 + t * 22, by = 866 + Math.sin(t * 1.3) * 2, rot = Math.sin(t * 1.1) * 0.02;
  g.save(); g.translate(bx, by); g.rotate(rot); g.fillStyle = '#1D1736';
  g.beginPath(); g.moveTo(-58, 0); g.lineTo(58, 0); g.quadraticCurveTo(46, 26, 0, 26); g.quadraticCurveTo(-46, 26, -58, 0); g.fill();
  g.beginPath(); g.moveTo(-10, -8); g.lineTo(-10, -92); g.lineTo(52, -8); g.closePath(); g.fill();
  g.restore();
  g.fillStyle = 'rgba(29,23,54,.35)';
  for (let i = 0; i < 9; i++) { const w = 100 - i * 9, y = by + 30 + i * 7; g.fillRect(bx - w / 2 + Math.sin(t * 2 + i) * 6, y, w, 3); }
  // grain, vignette, letterbox
  g.globalAlpha = 1; g.drawImage(grain, Math.floor((t * 24) % 7) * -8, Math.floor((t * 24) % 5) * -6, W + 64, H + 40);
  const v = g.createRadialGradient(W / 2, H / 2, 500, W / 2, H / 2, 1200); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(10,6,24,.5)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  g.fillStyle = '#000'; g.fillRect(0, 0, W, BAR); g.fillRect(0, H - BAR, W, BAR);
}
window.__seek = (t) => { draw(t); return Promise.resolve(true); };
window.__ready = Promise.resolve(true);
const q = new URLSearchParams(location.search);
draw(Number(q.get('t') || 4));
</script>
</html>
