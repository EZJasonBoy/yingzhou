<svg xmlns="http://www.w3.org/2000/svg" width="680" height="210" viewBox="0 0 680 210" font-family="sans-serif">
  <title>Name and logo candidates (2026-11-18)</title>
  <rect width="680" height="210" fill="#FFFFFF"/>
  <!-- 幻灯 Lanterna: a magic lantern whose glass is a play button -->
  <rect x="52" y="30" width="96" height="96" rx="22" fill="#1E2A44"/>
  <rect x="92" y="38" width="16" height="6" rx="2" fill="#F5B544"/>
  <circle cx="100" cy="76" r="26" fill="#F5B544"/>
  <polygon points="93,64 93,88 113,76" fill="#1E2A44"/>
  <rect x="88" y="104" width="24" height="5" rx="2" fill="#F5B544"/>
  <text x="100" y="152" text-anchor="middle" font-size="14" fill="#1F2937">幻灯</text>
  <text x="100" y="172" text-anchor="middle" font-size="12" fill="#6B7280">Lanterna</text>
  <!-- 映舟 Yingzhou: a boat whose sail is a play button -->
  <rect x="212" y="30" width="96" height="96" rx="22" fill="#0F766E"/>
  <polygon points="252,46 252,86 284,66" fill="#FFFFFF"/>
  <path d="M230 92 Q260 116 290 92 Z" fill="#A7F3D0"/>
  <path d="M232 108 q7 -4 14 0 t14 0 t14 0 t14 0" fill="none" stroke="#A7F3D0" stroke-width="2.5" stroke-linecap="round"/>
  <text x="260" y="152" text-anchor="middle" font-size="14" fill="#1F2937">映舟</text>
  <text x="260" y="172" text-anchor="middle" font-size="12" fill="#6B7280">Yingzhou</text>
  <!-- 棱影 Prism: one beam in (the engine), several out (the screens) -->
  <rect x="372" y="30" width="96" height="96" rx="22" fill="#312E81"/>
  <line x1="382" y1="82" x2="410" y2="80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <polygon points="420,50 400,98 440,98" fill="#6366F1" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  <line x1="430" y1="78" x2="458" y2="62" stroke="#F87171" stroke-width="4" stroke-linecap="round"/>
  <line x1="432" y1="80" x2="460" y2="80" stroke="#FBBF24" stroke-width="4" stroke-linecap="round"/>
  <line x1="430" y1="82" x2="458" y2="98" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
  <text x="420" y="152" text-anchor="middle" font-size="14" fill="#1F2937">棱影</text>
  <text x="420" y="172" text-anchor="middle" font-size="12" fill="#6B7280">Prism</text>
  <!-- 观止 Guanzhi: a screen with an eye that holds a play button -->
  <rect x="532" y="30" width="96" height="96" rx="22" fill="#E85D4A"/>
  <rect x="550" y="50" width="60" height="44" rx="10" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <line x1="568" y1="104" x2="592" y2="104" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <path d="M560 72 Q580 56 600 72 Q580 88 560 72 Z" fill="#FFFFFF"/>
  <polygon points="576,66 576,78 586,72" fill="#E85D4A"/>
  <text x="580" y="152" text-anchor="middle" font-size="14" fill="#1F2937">观止</text>
  <text x="580" y="172" text-anchor="middle" font-size="12" fill="#6B7280">Guanzhi</text>
</svg>
