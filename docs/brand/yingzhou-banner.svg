<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <title>映舟 Yingzhou — Android TV banner</title>
  <!-- The launcher banner of Android TV (320 x 180 at xhdpi): the logo of yingzhou-logo.svg on its indigo, the name
       beside it. Rendered to PNG by tools/brand/render-banner.mjs. -->
  <rect width="320" height="180" fill="#2F2C55"/>
  <g transform="translate(-6 4) scale(0.15)">
    <polygon points="420,236 420,560 694,398" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="56" stroke-linejoin="round"/>
    <path d="M216 636 H808 Q770 806 512 806 Q254 806 216 636 Z" fill="#F4A08A"/>
    <path d="M262 892 q50 -34 100 0" fill="none" stroke="#EE8C86" stroke-width="30" stroke-linecap="round"/>
    <path d="M362 892 q50 34 100 0 q50 -34 100 0" fill="none" stroke="#F0C670" stroke-width="30" stroke-linecap="round"/>
    <path d="M562 892 q50 34 100 0 q50 -34 100 0" fill="none" stroke="#84CFAE" stroke-width="30" stroke-linecap="round"/>
  </g>
  <text x="138" y="98" fill="#FFFFFF" font-size="50" font-weight="700"
        font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', 'Source Han Sans SC', sans-serif">映舟</text>
  <text x="140" y="130" fill="#F4A08A" font-size="19" font-weight="600" letter-spacing="1.5"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">Yingzhou</text>
</svg>
