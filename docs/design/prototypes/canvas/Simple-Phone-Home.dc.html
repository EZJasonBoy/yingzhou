<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简单模式 · 手机首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#a9452f;text-decoration:none}a:hover{color:#8c3826}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f6f4fa; color: #1c1a36; font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei UI', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="flex-grow: 1; padding: 52px 16px 16px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">
    <header style="display: flex; align-items: center; gap: 10px">
      <img src="/_blob/fe6f97f08daa9b59c906a0df93c38058" alt="映舟" style="width: 32px; height: 32px; border-radius: 8px">
      <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 24px; line-height: 32px; letter-spacing: 0.04em">首页</h1>
      <span style="display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 8px 0 12px; border-radius: 999px; border: 1px solid #dedaea; background: #ffffff; font-size: 14px; color: #1c1a36">示例站 A<svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4 L12 9 L7 14" fill="none" stroke="#55517a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <button type="button" aria-label="设置（已上锁）" style="margin-left: auto; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="4" y="10" width="14" height="10" rx="2.5" fill="none" stroke="#55517a" stroke-width="2"/><path d="M7.5 10 V7 a3.5 3.5 0 0 1 7 0 V10" fill="none" stroke="#55517a" stroke-width="2"/></svg>
      </button>
    </header>

    <section style="display: flex; flex-direction: column; gap: 12px; padding: 12px; border-radius: 16px; background: #ffffff; box-shadow: 0 10px 24px rgba(28,26,54,0.10)">
      <div style="position: relative; height: 188px; border-radius: 10px; overflow: hidden; background: #e4e0f0">
        <img src="/_blob/4acb575712e2fcc2835eef4d48d2b281" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(to top, rgba(6,5,26,0.8), rgba(6,5,26,0))"></div>
        <svg width="318" height="10" viewBox="0 0 318 10" style="position: absolute; left: 12px; bottom: 10px" aria-hidden="true">
          <line x1="0" y1="5" x2="318" y2="5" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
          <path d="M0 5 q6 -3 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" fill="none" stroke="#f4a08a" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px">
        <span style="font-size: 13px; line-height: 20px; color: #55517a">继续看</span>
        <span style="font-size: 18px; line-height: 26px; font-weight: 600">星河往事 第二季</span>
        <span style="font-size: 14px; line-height: 20px; color: #55517a">第 3 集 · 还剩 12 分钟</span>
      </div>
      <button type="button" style="height: 52px; border: 0; border-radius: 12px; background: #f4a08a; color: #2a1520; font-family: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px">
        <svg width="14" height="16" viewBox="0 0 14 16" aria-hidden="true"><path d="M1 1 L13 8 L1 15 Z" fill="#2a1520"/></svg>继续播放
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">常看的频道</h2>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #ffffff; min-height: 48px"><span style="font-size: 15px; line-height: 22px; font-weight: 600">江上纪实</span><span style="font-size: 13px; line-height: 20px; color: #55517a">纸船远航</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #ffffff; min-height: 48px"><span style="font-size: 15px; line-height: 22px; font-weight: 600">大江电影</span><span style="font-size: 13px; line-height: 20px; color: #55517a">山海长歌</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #ffffff; min-height: 48px"><span style="font-size: 15px; line-height: 22px; font-weight: 600">平野新闻</span><span style="font-size: 13px; line-height: 20px; color: #55517a">傍晚新闻</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: 12px; background: #ffffff; min-height: 48px"><span style="font-size: 15px; line-height: 22px; font-weight: 600">孤舟剧场</span><span style="font-size: 13px; line-height: 20px; color: #55517a">雾港来信</span></div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">收藏</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <img src="/_blob/1f5457874074ae945f6d04490f9e6cca" alt="星垂平野" style="width: 100%; aspect-ratio: 0.7; object-fit: cover; border-radius: 10px; display: block">
        <img src="/_blob/03400aa47610c4e40e8c177cc8bc05b8" alt="山海长歌" style="width: 100%; aspect-ratio: 0.7; object-fit: cover; border-radius: 10px; display: block">
        <img src="/_blob/b61eee520c6b329701e77c46a36b294e" alt="月面花园" style="width: 100%; aspect-ratio: 0.7; object-fit: cover; border-radius: 10px; display: block">
      </div>
    </section>
  </div>

  <nav style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 8px 8px 24px; background: #ebe8f3">
    <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #a9452f; font-size: 12px; line-height: 16px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 L12 4 L20 11 V20 H14 V14 H10 V20 H4 Z" fill="#a9452f"/></svg>首页
      <svg width="18" height="5" viewBox="0 0 22 6" aria-hidden="true"><path d="M1 4 q2.5 -3 5 0" fill="none" stroke="#cf5f5a" stroke-width="2" stroke-linecap="round"/><path d="M6 4 q2.5 3 5 0" fill="none" stroke="#a87a12" stroke-width="2" stroke-linecap="round"/><path d="M11 4 q2.5 -3 5 0 q2.5 3 5 0" fill="none" stroke="#2e8a66" stroke-width="2" stroke-linecap="round"/></svg>
    </span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #55517a; font-size: 12px; line-height: 16px; padding-bottom: 7px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="#55517a" stroke-width="2"/><path d="M8 3 L12 7 L16 3" fill="none" stroke="#55517a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>直播
    </span>
    <span style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 48px; justify-content: center; color: #55517a; font-size: 12px; line-height: 16px; padding-bottom: 7px">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="#55517a" stroke-width="2"/><path d="M16 16 L20 20" stroke="#55517a" stroke-width="2" stroke-linecap="round"/></svg>搜索
    </span>
  </nav>
</div>
</x-dc>

</body>
</html>
