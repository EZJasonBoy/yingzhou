<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>简单模式 · 电视首页</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;600&amp;family=Noto+Serif+SC:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#ece9ff;text-decoration:none}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 32px 64px 28px; background: #13122b; color: #ece9ff; font-family: 'Noto Sans SC', 'Microsoft YaHei UI', 'PingFang SC', sans-serif; display: flex; flex-direction: column; gap: 28px; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 40px">
    <img src="/_blob/fe6f97f08daa9b59c906a0df93c38058" alt="映舟" style="width: 40px; height: 40px; border-radius: 9px">
    <nav style="display: flex; gap: 36px; align-items: flex-end">
      <span style="display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 22px; line-height: 30px; font-weight: 600; color: #ece9ff">首页
        <svg width="26" height="7" viewBox="0 0 22 6" aria-hidden="true"><path d="M1 4 q2.5 -3 5 0" fill="none" stroke="#ee8c86" stroke-width="2" stroke-linecap="round"/><path d="M6 4 q2.5 3 5 0" fill="none" stroke="#f0c670" stroke-width="2" stroke-linecap="round"/><path d="M11 4 q2.5 -3 5 0 q2.5 3 5 0" fill="none" stroke="#84cfae" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      <span style="font-size: 22px; line-height: 30px; color: #aaa6d2; padding-bottom: 13px">直播</span>
      <span style="font-size: 22px; line-height: 30px; color: #aaa6d2; padding-bottom: 13px">搜索</span>
    </nav>
    <span style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px 0 18px; border-radius: 999px; border: 1.5px solid #3a3768; font-size: 18px; color: #ece9ff">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5" fill="none" stroke="#aaa6d2" stroke-width="2"/><rect x="4" y="14" width="16" height="6" rx="1.5" fill="none" stroke="#aaa6d2" stroke-width="2"/></svg>示例站 A<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4 L12 9 L7 14" fill="none" stroke="#aaa6d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span style="margin-left: auto; font-family: Barlow, sans-serif; font-size: 22px; font-weight: 500; color: #aaa6d2; font-variant-numeric: tabular-nums">20:41</span>
  </header>

  <section style="display: flex; gap: 40px; align-items: stretch">
    <div style="position: relative; width: 600px; height: 338px; border-radius: 14px; overflow: hidden; flex: none; background: #221f45">
      <img src="/_blob/4acb575712e2fcc2835eef4d48d2b281" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: linear-gradient(to top, rgba(6,5,26,0.85), rgba(6,5,26,0))"></div>
      <svg width="568" height="14" viewBox="0 0 568 14" style="position: absolute; left: 16px; bottom: 14px" aria-hidden="true">
        <line x1="0" y1="7" x2="568" y2="7" stroke="#ece9ff" stroke-opacity="0.25" stroke-width="2"/>
        <path d="M0 7 q10 -4 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#f4a08a" stroke-width="3" stroke-linecap="round"/>
        <circle cx="460" cy="7" r="6" fill="#f4a08a"/>
      </svg>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px; padding-top: 8px; min-width: 0">
      <span style="font-size: 20px; line-height: 28px; color: #aaa6d2">继续看</span>
      <h1 style="margin: 0; font-family: 'Noto Serif SC', 'Songti SC', serif; font-weight: 600; font-size: 44px; line-height: 54px; letter-spacing: 0.02em">星河往事 第二季</h1>
      <span style="font-size: 20px; line-height: 28px; color: #aaa6d2">第 3 集 · 还剩 12 分钟</span>
      <div style="margin-top: auto; display: flex; gap: 20px; align-items: center">
        <a href="Simple-TV-Player.dc.html" style="display: inline-flex; align-items: center; gap: 12px; height: 60px; padding: 0 32px; border-radius: 14px; background: #f4a08a; color: #2a1520; font-size: 22px; font-weight: 600; outline: 4px solid #f4a08a; outline-offset: 4px; box-shadow: 0 0 30px rgba(244,160,138,0.45)">
          <svg width="20" height="22" viewBox="0 0 20 22" aria-hidden="true"><path d="M2 2 L18 11 L2 20 Z" fill="#2a1520"/></svg>继续播放
        </a>
        <span style="display: inline-flex; align-items: center; height: 60px; padding: 0 28px; border-radius: 14px; border: 2px solid #726eab; font-size: 21px; color: #ece9ff">从第 1 集看</span>
      </div>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600">常看的频道</h2>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 14px; background: #1b1a3a">
        <span style="font-size: 22px; line-height: 30px; font-weight: 600">江上纪实</span>
        <span style="font-size: 17px; line-height: 24px; color: #aaa6d2">正在播：纸船远航</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 14px; background: #1b1a3a">
        <span style="font-size: 22px; line-height: 30px; font-weight: 600">大江电影</span>
        <span style="font-size: 17px; line-height: 24px; color: #aaa6d2">正在播：山海长歌</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 14px; background: #1b1a3a">
        <span style="font-size: 22px; line-height: 30px; font-weight: 600">平野新闻</span>
        <span style="font-size: 17px; line-height: 24px; color: #aaa6d2">正在播：傍晚新闻</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; border-radius: 14px; background: #1b1a3a">
        <span style="font-size: 22px; line-height: 30px; font-weight: 600">孤舟剧场</span>
        <span style="font-size: 17px; line-height: 24px; color: #aaa6d2">正在播：雾港来信 第 6 集</span>
      </div>
    </div>
  </section>

  <footer style="margin-top: auto; display: flex; gap: 28px; font-size: 16px; line-height: 24px; color: #8d89bb">
    <span>OK 继续播放</span><span>↓ 最近看过和收藏</span><span>↑ 站点：右边弹出列表</span>
  </footer>
</div>
</x-dc>

</body>
</html>
