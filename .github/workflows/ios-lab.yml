name: iOS Go engine

on:
  workflow_dispatch:
  push:
    branches: [lab/engine-go]
    paths:
      - 'client/**'
      - 'lab/engine-go/**'
      - 'tools/build-ios-go.sh'
      - '.github/workflows/ios-lab.yml'

permissions:
  contents: read

concurrency:
  group: ios-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: [device, simulator]
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build unsigned iPhone and iPad package
        if: matrix.target == 'device'
        run: |
          flutter build ios --release --no-codesign --no-pub
          mkdir -p "$RUNNER_TEMP/Payload"
          ditto build/ios/iphoneos/Runner.app "$RUNNER_TEMP/Payload/Runner.app"
          (cd "$RUNNER_TEMP" && zip -qry yingzhou-ios-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'device'
        with:
          name: yingzhou-ios-unsigned
          path: ${{ runner.temp }}/yingzhou-ios-unsigned.ipa
          if-no-files-found: error
      - name: Boot an iPhone simulator
        if: matrix.target == 'simulator'
        run: |
          device=$(xcrun simctl list devices available --json | jq -er '[.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          xcrun simctl bootstatus "$device" -b
          echo "SIMULATOR_UDID=$device" >> "$GITHUB_ENV"
      - name: Build and launch the simulator app
        if: matrix.target == 'simulator'
        run: |
          flutter build ios --simulator --debug --no-pub
          app=build/ios/iphonesimulator/Runner.app
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/yingzhou-ios-simulator.zip"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch "$SIMULATOR_UDID" "$bundle_id"
      - name: Import a subscription and play through the embedded engine
        if: matrix.target == 'simulator'
        run: flutter test --no-pub -d "$SIMULATOR_UDID" integration_test/ios_go_engine_test.dart
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'simulator'
        with:
          name: yingzhou-ios-simulator
          path: ${{ runner.temp }}/yingzhou-ios-simulator.zip
          if-no-files-found: error
