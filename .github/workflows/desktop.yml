# Desktop packages and releases.
#
# - Windows: zip and Inno Setup installer. Engine and client tests run first.
# - macOS (Apple Silicon): DMG with a JRE for arm64. Never tried on a real Mac yet, so a failure here does not hold
#   back the release; the Windows packages are published without it.
# - Android: APKs per ABI, signed with the release key from the repository secrets (ANDROID_KEYSTORE_*). A failure
#   does not hold back the release either.
# - Linux (x64): tarball and .deb, built on Ubuntu 24.04 (they need its libmpv and glibc or newer). The .deb is
#   installed and the app started on a virtual screen, then the desktop integration test plays the demo; only when
#   both pass are the packages uploaded. A failure does not hold back the release either.
# - A tag v* publishes a GitHub Release with whatever was built. A manual run only uploads the packages as
#   workflow artifacts.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # The installer script needs Inno Setup 7 (its Simplified Chinese messages and wizard options); the runner
      # image only has 6. Same version as the one the packages were first built with.
      - name: Inno Setup 7
        shell: pwsh
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe" -OutFile $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($hash -ne "8A5A6711C3766A6E5FB74F280BA0E3551E719CE94538D901FDBD1F8F9920B3F0") { throw "unexpected Inno Setup download: $hash" }
          $dir = "$env:RUNNER_TEMP\InnoSetup7"
          Start-Process $exe -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=$dir"
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "ISCC.exe not installed" }
          "ISCC=$dir\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The Python spider tests run a real Python; without one they are skipped.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.13"

      - name: Engine tests
        working-directory: engine
        shell: bash
        env:
          TVBOX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./gradlew test --console=plain

      - name: Client tests
        working-directory: client
        run: flutter test

      - name: Package
        shell: bash
        run: bash tools/package-desktop.sh

      - name: Check both packages exist
        shell: bash
        run: ls -la dist/yingzhou-windows-x64.zip dist/yingzhou-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: yingzhou-windows-x64
          path: |
            dist/yingzhou-windows-x64.zip
            dist/yingzhou-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple Silicon (macos-14 is no longer offered)
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Package
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash tools/package-desktop.sh

      - uses: actions/upload-artifact@v4
        with:
          name: yingzhou-macos-arm64
          path: dist/yingzhou-macos-*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # Signed with the release key from the repository's secrets; without them (a fork) the APKs carry the debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::no release signing key; the APKs are signed with the debug key"
          fi

      - name: Build APKs
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # One retry: Gradle fetches from the plugin portal and Maven Central, which fail now and then
          # (v0.3.0's first build lost its APKs to a portal outage).
          flutter build apk --release --split-per-abi || { echo "Build failed; retrying once in 60 s"; sleep 60; flutter build apk --release --split-per-abi; }
          mkdir -p ../dist
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do cp "app-$abi-release.apk" "../../../../../dist/yingzhou-android-$abi.apk"; done
          ls -la ../../../../../dist

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: yingzhou-android
          path: dist/yingzhou-android-*.apk
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      SHOTS: ${{ github.workspace }}/smoke
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      # Flutter's Linux toolchain, GTK, X11 and Xi (window_manager), libmpv (media_kit) and dpkg-dev for the .deb.
      # Then what the smoke test needs: a virtual screen with a window manager (fullscreen is the window manager's
      # job), software OpenGL, Chinese fonts, and tools to look at the screen.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev \
            liblzma-dev libmpv-dev dpkg-dev
          sudo apt-get install -y --no-install-recommends xvfb openbox libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            fonts-noto-cjk imagemagick xdotool x11-utils

      - name: Package
        run: bash tools/package-desktop.sh

      - name: Check both packages exist
        run: |
          ls -la dist/yingzhou-linux-x64.tar.gz dist/yingzhou-linux-x64.deb
          tar -tzf dist/yingzhou-linux-x64.tar.gz | grep -E '^yingzhou/(yingzhou|engine/jre/bin/java|install-desktop-entry.sh|share/applications/.*\.desktop)$'
          dpkg-deb --contents dist/yingzhou-linux-x64.deb | grep -E ' \./(usr/bin/yingzhou|opt/yingzhou/yingzhou|usr/share/applications/.*\.desktop)'

      # apt resolves the package's dependencies: what a user's `apt install ./yingzhou-linux-x64.deb` does.
      - name: Install the .deb
        run: sudo apt-get install -y ./dist/yingzhou-linux-x64.deb

      - name: Virtual screen
        run: |
          mkdir -p "$SHOTS"
          Xvfb :99 -screen 0 1920x1080x24 > "$SHOTS/xvfb.log" 2>&1 &
          sleep 2
          DISPLAY=:99 openbox > "$SHOTS/openbox.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      # The installed app as a user starts it: a new home folder, its own engine from the bundled runtime on 9978.
      # Moves and resizes the window, quits, and checks that the next start puts it back; that the settings and the
      # engine's data are where docs/user-guide.md says; and that the engine ends with the app.
      - name: Smoke test (installed app)
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          start_app() {
            yingzhou >> "$SHOTS/app.log" 2>&1 &
            app=$!
            win=$(timeout 60 xdotool search --sync --onlyvisible --classname io.github.sa1koro.yingzhou | head -n 1)
            echo "window $win: $(xdotool getwindowname "$win")"
          }
          # Where the content is on screen and how big: x y width height.
          geometry() {
            xwininfo -id "$win" | awk '/Absolute upper-left X/ {x = $4} /Absolute upper-left Y/ {y = $4}
              /Width:/ {w = $2} /Height:/ {h = $2} END {print x, y, w, h}'
          }
          start_app
          [ "$(xdotool getwindowname "$win")" = "映舟" ] || { echo "::error::window title is not 映舟"; exit 1; }
          for i in $(seq 90); do curl -sf http://127.0.0.1:9978/api/v1/info > "$SHOTS/engine-info.json" && break; sleep 1; done
          cat "$SHOTS/engine-info.json"
          ps -o args= -C java | grep -q '^/opt/yingzhou/engine/jre/bin/java ' || { echo "::error::the engine is not the bundled runtime"; ps -ef | grep java; exit 1; }
          sleep 8
          import -window root "$SHOTS/app-first-start.png"

          echo "first start: $(geometry)"
          xdotool windowsize "$win" 1100 700
          xdotool windowmove "$win" 150 90
          sleep 3
          before=$(geometry)
          echo "moved to: $before"
          prefs="$HOME/.local/share/io.github.sa1koro.yingzhou/shared_preferences.json"
          cat "$prefs"; echo
          grep -q '"flutter.window.bounds"' "$prefs" || { echo "::error::window bounds not saved in $prefs"; exit 1; }
          kill "$app"; wait "$app" || true
          for i in $(seq 20); do pgrep -f tvbox.engine.server.MainKt > /dev/null || break; sleep 1; done
          if pgrep -f tvbox.engine.server.MainKt; then echo "::error::the engine outlived the app"; exit 1; fi
          # Java takes user.home from the password database, not from $HOME.
          ls -la "$(getent passwd "$(id -un)" | cut -d: -f6)/.tvbox-next/engine"

          # Twice: a window that comes back a little bigger each time would show on the second.
          for run in 2 3; do
            start_app
            sleep 5
            after=$(geometry)
            echo "start $run: $after"
            import -window root "$SHOTS/app-restored-$run.png"
            kill "$app"; wait "$app" || true
            for i in $(seq 20); do pgrep -f tvbox.engine.server.MainKt > /dev/null || break; sleep 1; done
            read -r x0 y0 w0 h0 <<< "$before"
            read -r x1 y1 w1 h1 <<< "$after"
            for d in $((x1 - x0)) $((y1 - y0)) $((w1 - w0)) $((h1 - h0)); do
              [ "${d#-}" -le 3 ] || { echo "::error::start $run put the window at $after, not $before"; exit 1; }
            done
          done

      # The desktop integration test (browse, play, fullscreen, subtitles, danmaku, a dead line) against the demo
      # engine, which runs on the package's own Java runtime.
      - name: Smoke test (integration test)
        run: |
          set -euo pipefail
          /opt/yingzhou/engine/jre/bin/java -XX:+UnlockDiagnosticVMOptions -XX:-BytecodeVerificationRemote \
            -cp "/opt/yingzhou/engine/lib/*" tvbox.engine.server.MainKt --demo --port 19978 > "$SHOTS/demo-engine.log" 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:19978/api/v1/info > /dev/null && break; sleep 1; done
          cd client
          flutter test integration_test/desktop_play_test.dart -d linux --dart-define=SHOT_DIR="$SHOTS" 2>&1 | tee "$SHOTS/desktop_play_test.log"

      # Screenshots and logs, for a look at what the runner saw. Not on tags: the release publishes every artifact.
      - uses: actions/upload-artifact@v4
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          name: linux-smoke
          path: smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: yingzhou-linux-x64
          path: |
            dist/yingzhou-linux-x64.tar.gz
            dist/yingzhou-linux-x64.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    needs: [windows, macos, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la packages
          notes="$(mktemp)"
          {
            echo "映舟（Yingzhou）${TAG}，自动构建。"
            echo
            echo "- Windows：\`yingzhou-windows-x64-setup.exe\` 是安装程序，\`yingzhou-windows-x64.zip\` 是绿色包（解压后运行 yingzhou.exe）。都自带引擎和 Java 运行时。安装程序没有数字签名，第一次运行时 SmartScreen 可能拦一下，点「更多信息 → 仍要运行」。"
            echo "- macOS（Apple Silicon）：\`.dmg\`，临时签名，第一次需右键 → 打开。尚未在真机上验证；没有这个文件说明这次 macOS 构建失败了。"
            echo "- Linux（x64）：\`yingzhou-linux-x64.deb\` 给 Ubuntu 24.04 及以后、Debian 13 等（\`sudo apt install ./yingzhou-linux-x64.deb\`），\`yingzhou-linux-x64.tar.gz\` 解压即用（需要系统里有 libmpv 和 GTK 3）。都自带引擎和 Java 运行时。只在 CI 的虚拟屏幕上验证过；没有这些文件说明这次 Linux 构建失败了。"
            echo "- Android（手机、平板、电视盒子）：\`yingzhou-android-arm64-v8a.apk\` 适合绝大多数手机和较新的盒子，\`armeabi-v7a\` 给 32 位的老电视盒子，\`x86_64\` 给模拟器。没有这些文件说明这次 Android 构建失败了。"
            echo
            echo "本应用不带任何订阅或影视内容。改动见 [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)，已知问题见 [docs/status.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/status.md)。"
          } > "$notes"
          # A rerun of a failed job (say Android) reruns this job too: add the files to the release it already made.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" packages/* --clobber
          else
            gh release create "$TAG" packages/* --title "映舟 ${TAG}" --notes-file "$notes" --prerelease --verify-tag
          fi
