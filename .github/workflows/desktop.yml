# Desktop packages: Windows zip, macOS DMGs for Apple Silicon and Intel (each Mac build bundles a JRE for its CPU).
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tvbox-next-windows-x64
            path: dist/tvbox-next-windows-x64.zip
          - os: macos-14 # Apple Silicon
            artifact: tvbox-next-macos-arm64
            path: dist/tvbox-next-macos-arm64.dmg
          - os: macos-13 # Intel
            artifact: tvbox-next-macos-x86_64
            path: dist/tvbox-next-macos-x86_64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true

      - name: Engine tests
        working-directory: engine
        shell: bash
        run: ./gradlew test --console=plain

      - name: Client tests
        working-directory: client
        run: flutter test

      - name: Package
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: bash tools/package-desktop.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
